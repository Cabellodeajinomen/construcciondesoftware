spring.application.name=biblioteca
# currentSchema=biblioteca: las tablas del modelo nuevo van en su propio esquema y no chocan con las tablas viejas de libreria
spring.datasource.url=jdbc:postgresql://ep-summer-fog-acqb2nty.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require&currentSchema=biblioteca
spring.datasource.username=neondb_owner
spring.datasource.password=npg_XNe3Pn2yBWtT
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
# cada conexion nueva trabaja en el esquema biblioteca (por si Neon ignora currentSchema)
spring.datasource.hikari.connection-init-sql=SET search_path TO biblioteca

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=biblioteca
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# carga los datos de ejemplo (data.sql) despues de que Hibernate crea las tablas.
# data.sql usa ON CONFLICT DO NOTHING, asi que se puede ejecutar en cada arranque sin duplicar filas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true