# Las pruebas usan una base H2 en memoria (modo PostgreSQL), no la base real de Neon.
# Asi los tests no ensucian tus datos y siempre arrancan con los mismos datos de data.sql.
spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:biblioteca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
