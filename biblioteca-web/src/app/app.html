<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <nav class="contenedor navbar" aria-label="Principal">
    <a routerLink="/inicio" class="marca" (click)="cerrarMenu()">Biblioteca ULS</a>

    <!-- Botón hamburguesa: solo se ve en pantallas pequeñas -->
    <button type="button" class="menu-toggle" (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto" aria-controls="menu-principal"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'">
      {{ menuAbierto ? '✕' : '☰' }}
    </button>

    <ul id="menu-principal" class="nav-links" [class.abierto]="menuAbierto">
      @for (op of opcionesMenu; track op.ruta) {
        <li>
          <a [routerLink]="op.ruta" routerLinkActive="activo" (click)="cerrarMenu()">{{ op.texto }}</a>
        </li>
      }
    </ul>
  </nav>
</header>

<main id="contenido" class="contenedor" tabindex="-1">
  <router-outlet />
</main>

<footer class="pie contenedor">Sistema de Biblioteca · Universidad La Salle</footer>
